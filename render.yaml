services:
  - type: web
    name: picdrop-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://picdrop.jeremysu0818.github.io
      - key: TTL_MS
        value: "1800000"
      - key: MAX_JSON_SIZE
        value: 25mb
